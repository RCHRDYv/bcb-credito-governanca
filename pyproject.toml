# =============================================================================
# PT: Dependências Python do projeto. O dbt roda como ferramenta à parte
#     (uv tool install dbt-core --with dbt-databricks), então não entra aqui.
# EN: Project Python dependencies. dbt runs as a separate tool
#     (uv tool install dbt-core --with dbt-databricks), so it is not listed.
#
# PT: Uso:  uv run python -m ingestion.baixar
# EN: Usage: uv run python -m ingestion.baixar
# =============================================================================

[project]
name = "bcb-credito-governanca"
version = "0.1.0"
description = "Ontologia e camada semântica sobre os dados de crédito do Banco Central"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.40",
    "duckdb>=1.1",
    "huggingface-hub>=1.0",
    "lightgbm>=4.7.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "polars>=1.0",
    "prophet>=1.5.0",
    "pyyaml>=6",
    "statsmodels>=0.14",
]

[tool.uv]
# PT: projeto de aplicação, não pacote publicável.
# EN: application project, not a publishable package.
package = false

[dependency-groups]
# PT: corpus e índice do RAG (issue #46, ADR 0028). Ficam num grupo à parte
#     porque o torch é pesado e nada do RAG roda no CI: o uv sync --frozen
#     do CI não instala este grupo. O torch do PyPI é o de CPU no Windows,
#     que é onde os embeddings rodam (decisão de 2026-10-07).
#     Uso: uv run --group rag python -m rag.construir
# EN: RAG corpus and index. A separate group because torch is heavy and
#     nothing RAG runs in CI. PyPI torch is the CPU build on Windows.
rag = [
    "pypdf>=6",
    "sentence-transformers>=5",
    "xlrd>=2",
]
