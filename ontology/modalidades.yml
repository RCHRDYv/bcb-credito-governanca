      coobrigação por parte do cedente. O cliente informado será o sacado da
      operação original
    confianca: verbatim
    fonte: "Instruções 3040, p. 35"
    aviso: >
      Mesmo nome de 0250 e 0450, definição diferente: aqui os créditos são
      especificados e o cliente é o sacado. Em 0250 e 0450 os créditos não
      estão identificados e o cliente é o cedente.

