      de suas compras (produtos e serviços), caracterizadas pelo fato de que
      o desembolso inicial ocorre com o pagamento à vista das compras, pela
      instituição financeira, diretamente ao fornecedor. As operações de
      "Floor-Plan" devem ser registradas nessa modalidade
    confianca: verbatim
    fonte: "Instruções 3040, p. 28"

