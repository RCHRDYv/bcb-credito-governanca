    historyNote: >
      Novo modelo de crédito imobiliário, de 2025-10-10 (Resolução CMN
      5.255, com a CMN 5.254 e a Resolução BCB 512). Na data da publicação,
      o valor máximo de avaliação do imóvel financiado no SFH passou de R$
      1,5 milhão para R$ 2,25 milhões. Financiamentos novos de imóveis nessa
      faixa podem ser SFH (0901) desde então, e antes seriam fora do SFH
      (0902): a fronteira entre as duas submodalidades muda dentro do
      recorte do projeto, e o efeito no dado não foi medido. Ajustes no
      direcionamento da poupança valem desde 2026-01-01, e o modelo novo a
      partir de 2027.
