    definition: >
      devem ser registrados nessa modalidade, desde que haja incidência de
      juros, os financiamentos parcelados pela instituição financeira, bem
      como os saques em cartão de crédito financiado (pagamento em múltiplas
      parcelas).
    confianca: verbatim
    fonte: "Instruções 3040, p. 28"
    scopeNote: "Uma das cinco submodalidades de cartão."

  - id: sub_0440
    notation: "0440"
    tipo: submodalidade
    broader: mod_04
    prefLabel_pt: "financiamentos agroindustriais"
