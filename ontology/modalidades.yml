# =============================================================================
# PT: Ontologia das modalidades e submodalidades de crédito do SCR.data (V2).
#     Cada conceito carrega a definição oficial, a página de onde ela vem, o
#     nível de confiança e o rótulo EXATO com que aparece no dado, que é a
#     chave de junção. Os nomes oficiais divergem entre documentos e entre
#     documento e dado, por isso nome oficial e rótulo no dado são campos
#     separados.
# EN: Ontology of SCR.data (V2) credit modalities and sub-modalities. Each
#     concept carries the official definition, the page it comes from, the
#     confidence level and the EXACT label found in the data, which is the
#     join key. Official names diverge across documents and between documents
#     and data, so official name and data label are separate fields.
#
# PT: Estrutura SKOS conforme ADR 0002. Validação contra o dado:
#     uv run python -m scripts.validar_modalidades
# EN: SKOS structure per ADR 0002. Validation against the data:
#     uv run python -m scripts.validar_modalidades
#
# -----------------------------------------------------------------------------
# confianca:
#   verbatim      = definição transcrita literalmente da fonte
#   parafraseado  = redação própria, sentido diretamente amparado na fonte
#   inferido      = conclusão a partir de contexto, não declarada na fonte
#   lacuna        = não encontrado em nenhum documento consultado
# =============================================================================

esquema:
  id: scr-modalidades
  titulo: "Modalidades e submodalidades de crédito do SCR.data, Versão 2"
  data_leitura: "2026-09-21"
  fontes:
    instrucoes:
      nome: "Instruções de Preenchimento do Documento 3040, seção IV (Mod), pp. 20 a 36"
      url: "https://www.bcb.gov.br/content/estabilidadefinanceira/Leiaute_de_documentos/scrdoc3040/SCR_InstrucoesDePreenchimento_Doc3040.pdf"
      papel: "Fonte das definições. Os códigos e nomes da tabela 'Mod Descrição' de cada modalidade são o prefLabel."
    anexo3:
      nome: "Leiaute do Documento 3040, aba Anexo, Anexo 3 (Modalidade Operação)"
      url: "https://www.bcb.gov.br/content/estabilidadefinanceira/Leiaute_de_documentos/scrdoc3040/SCR3040_Leiaute.xls"
      papel: "Lista de códigos e nomes. Não traz definição. Quando o nome difere das Instruções, entra como altLabel."
    historico:
      nome: "Leiaute do Documento 3040, aba HistoricoAtualizacoes"
      papel: "Datas e normas das renomeações e das inclusões e exclusões de submodalidades."
    dado:
      nome: "SCR.data V2, camada bronze, jan/2024 a jul/2026"
      papel: "rotulo_no_dado: valor exato da coluna modalidade ou submodalidade, depois de trim."
  nota_de_transcricao: >
    As definições marcadas como verbatim foram transcritas do PDF das
    Instruções. A extração de texto do PDF insere espaços espúrios no meio de
    palavras ("utilizaçã o", "mo dalidade"), e esses espaços foram removidos.
    Nenhuma outra alteração foi feita. Trechos que tratam só de como preencher
    o documento, sem dizer o que a operação é, ficaram de fora da definição.

# =============================================================================
# PT: Avisos que valem para o conjunto e que o dado não carrega.
# EN: Warnings that apply to the whole set and do not travel with the data.
# =============================================================================

avisos_gerais:

  - id: modalidade_e_conta_contabil
    gravidade: media
    descricao: >
      A modalidade é definida pela conta contábil do Cosif em que a operação
      é lançada, e não por característica de produto. As Instruções definem
      cada modalidade como "operações lançadas na rubrica" de uma conta.
    historyNote: >
      As contas mudaram em janeiro de 2025, com o novo plano contábil ligado à
      Resolução CMN 4.966. As Instruções trazem as duas numerações, a antiga e
      a "a partir de jan/25". É a mesma data da quebra do ativo problemático
      (docs/cadeia-normativa.md).
    confianca: verbatim
    fonte: "Instruções 3040, pp. 20 a 35"

  - id: cartao_de_credito_em_tres_modalidades
    gravidade: alta
    descricao: >
      Cartão de crédito não é uma modalidade. As operações de cartão estão em
      cinco submodalidades de três modalidades diferentes: 0204, 0210 e 0218
      em Empréstimos; 0406 em Financiamentos; 1304 em Outros créditos. A
      compra comum no cartão, sem juros, está em Outros créditos (1304).
    consequencia: >
      Filtrar "cartão de crédito" pela coluna modalidade não encontra nada.
      Somar só Empréstimos deixa de fora a maior parte: em jun/2026, a 1304
      sozinha soma R$ 594,7 bi.
    confianca: verbatim
    fonte: "Instruções 3040, pp. 20 a 22, 27 a 28, 35"
    nao_confundir: >
      0303 "antecipação de fatura de cartão de crédito" é adiantamento a
      lojistas (pessoas jurídicas) sobre o que eles têm a receber das
      credenciadoras. Não é crédito ao portador do cartão.

  - id: garantia_nao_declarada
    gravidade: alta
    descricao: >
      Só uma definição declara garantia: 0211 home equity, "garantidos por
      hipoteca ou por alienação fiduciária de bens imóveis residenciais". As
      de capital de giro (0215 e 0216) citam "garantias" apenas como item do
      contrato, sem dizer qual, e as demais não mencionam garantia. O
      SCR.data não traz o campo de garantias do documento 3040 (Anexo 12 do
      leiaute).
    consequencia: >
      Classificar modalidades por "tem garantia real" a partir de normativo só
      é possível para 0211. Para as demais, qualquer classificação é
      suposição de domínio (por exemplo, supor que financiamento de veículo
      tem alienação fiduciária) e precisa ser marcada como inferida. Afeta a
      pergunta Q17 do experimento.
    confianca: verbatim
    fonte: "Instruções 3040, p. 22"
    tipos_no_documento_3040:
      descricao: >
        O documento 3040 tem o bloco de garantias (Gar) por operação, e cada
        operação pode ter várias. Cada garantia traz tipo e subtipo (Anexo
        12), valor original, valor e data de reavaliação, situação (Anexo
        47), tipo de valor (Anexo 48) e se é compartilhada com outra operação
        (Anexo 49). Os anexos 47 a 49 entraram com a IN BCB 659, de
        2025-09-08, que também reorganizou os subtipos: parte deles é
        descontinuada a partir da data-base maio/2026, trocada por subtipos
        mais detalhados, como imóvel residencial urbano com matrícula. Nada
        disso é publicado no SCR.data.
      confianca: verbatim
      fonte: "Leiaute do Documento 3040, aba Anexo, Anexo 12 (Garantias), e aba Doc3040, bloco c (Gar)"
      tipos:
        - {codigo: "01", nome: "cessão de direitos creditórios"}
        - {codigo: "02", nome: "caução"}
        - {codigo: "03", nome: "penhor"}
        - {codigo: "04", nome: "alienação fiduciária"}
        - {codigo: "05", nome: "hipoteca"}
        - {codigo: "06", nome: "operações garantidas pelo governo"}
        - {codigo: "07", nome: "outras garantias não fidejussórias"}
        - {codigo: "08", nome: "seguros ou garantia de outras entidades assemelhados"}
        - {codigo: "09", nome: "garantia fidejussória"}
        - {codigo: "10", nome: "bens arrendados"}
        - {codigo: "11", nome: "garantias internacionais"}
        - {codigo: "12", nome: "operações garantidas por outras entidades"}
        - {codigo: "13", nome: "acordos de compensação"}
        - {codigo: "14", nome: "ativos financeiros e valores mobiliários"}

  - id: nomes_divergentes
    gravidade: media
    descricao: >
      O mesmo código tem nomes diferentes nas Instruções, no Anexo 3, no
      histórico do leiaute e no dado. Exemplo extremo: 0217 é "capital de
      giro com crédito rotativo" na inclusão de 2017, "capital de giro com
      teto rotativo" no Anexo 3 e no dado, e "capital de giro rotativo" nas
      Instruções.
    consequencia: >
      A junção entre dado e ontologia usa rotulo_no_dado, nunca o nome
      oficial. Para cruzar documentos, usar o código (notation).
    confianca: verbatim
    fonte: "Instruções 3040; Anexo 3; HistoricoAtualizacoes; dado"

  - id: escopo_modalidades_01_a_13
    gravidade: baixa
    descricao: >
      O SCR.data traz só as modalidades 01 a 13. As modalidades 14 a 20 do
      Anexo 3 (relações interfinanceiras, coobrigações e garantias prestadas,
      títulos de crédito fora da carteira, limites e retenção de risco) não
      aparecem no dado.
    confianca: verbatim
    fonte: "Anexo 3; dado"

  - id: submodalidades_sem_ocorrencia
    gravidade: baixa
    descricao: >
      Dez submodalidades das modalidades 01 a 13 existem no Anexo 3 e não têm
      nenhuma linha no dado de jan/2024 a jul/2026.
    detalhe:
      - {codigo: "0201", motivo: "Excluída (nota a1 da planilha de equivalência). Substituída por 0213 e 0214."}
      - {codigo: "0205", motivo: "Excluída (nota a1). Substituída por 0215."}
      - {codigo: "0206", motivo: "Excluída (nota a1). Substituída por 0216."}
      - {codigo: "0890", motivo: "Excluída pela Carta-Circular 3.806/2017, a partir de jul/2017. O Anexo 3 ainda a lista."}
      - {codigo: "0407", motivo: "Sem ocorrência no período. Motivo não verificado."}
      - {codigo: "0690", motivo: "Sem ocorrência no período. Motivo não verificado."}
      - {codigo: "1203", motivo: "Sem ocorrência no período. Motivo não verificado."}
      - {codigo: "1207", motivo: "Sem ocorrência no período. Motivo não verificado."}
      - {codigo: "1290", motivo: "Sem ocorrência no período. Motivo não verificado."}
      - {codigo: "1390", motivo: "Sem ocorrência no período. Motivo não verificado."}
    confianca: verbatim
    fonte: "Anexo 3; Equivalencia_Modalidades.xlsx; HistoricoAtualizacoes; dado"

  - id: nem_todo_par_ocorre_em_todo_mes
    gravidade: media
    descricao: >
      Os 66 pares de modalidade e submodalidade são a união dos 31 meses.
      Nenhum mês isolado tem os 66: são 64 pares em 13 meses e 65 em 18 meses,
      medido em 2026-09-23. Dois pares aparecem só em parte da série.
    detalhe:
      - par: "Empréstimos | ARO - adiantamento de receitas orçamentárias"
        ocorrencia: "apenas dez/2024 e jan/2025, 2 meses"
      - par: "Financiamentos à exportação | Financiamento de projeto"
        ocorrencia: "de abr/2025 a jul/2026, 16 meses"
    consequencia: >
      Uma junção mês a mês com esta ontologia encontra 64 ou 65 pares, e isso é
      correto, não falha de cobertura. Um teste que exija 66 pares em todo mês
      reprovaria o dado certo. No sentido inverso, comparar a composição da
      carteira entre meses precisa considerar que uma submodalidade pode
      simplesmente não existir no mês de referência.
    confianca: verbatim
    fonte: "dado"

# =============================================================================
# PT: Conceitos. Modalidade seguida das suas submodalidades.
# EN: Concepts. Each modality followed by its sub-modalities.
# =============================================================================

conceitos:

  # ---------------------------------------------------------------------------
  # 01 Adiantamentos a depositantes
  # ---------------------------------------------------------------------------

  - id: mod_01
    notation: "01"
    tipo: modalidade
    prefLabel_pt: "Adiantamentos a depositantes"
    rotulo_no_dado: "Adiantamentos a depositantes"
    definition: >
      operações lançadas na rubrica 1.6.1.10.00-1 (1.6.1.10.01.10-5 a partir
      de jan/25)
    confianca: verbatim
    fonte: "Instruções 3040, p. 20"

  - id: sub_0101
    notation: "0101"
    tipo: submodalidade
    broader: mod_01
    prefLabel_pt: "adiantamentos a depositantes"
    rotulo_no_dado: "Adiantamentos a depositantes"
    definition: >
      operações lançadas na rubrica 1.6.1.10.00-1 (1.6.1.10.01.10-5 a partir
      de jan/25)
    confianca: verbatim
    fonte: "Instruções 3040, p. 20"
    scopeNote: "Única submodalidade da modalidade 01. A definição é a da modalidade."

  # ---------------------------------------------------------------------------
  # 02 Empréstimos
  # ---------------------------------------------------------------------------

  - id: mod_02
    notation: "02"
    tipo: modalidade
    prefLabel_pt: "Empréstimos"
    rotulo_no_dado: "Empréstimos"
    definition: >
      operações lançadas na rubrica 1.6.1.20.00-8 e 1.6.1.40.00-2
      (1.6.1.20.01.10-4 a partir de jan/25)
    confianca: verbatim
    fonte: "Instruções 3040, p. 20"

  - id: sub_0202
    notation: "0202"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "crédito pessoal - com consignação em folha de pagam."
    rotulo_no_dado: "Crédito pessoal - com consignação em folha de pagam."
    definition: >
      operações de crédito com retenção de parcela do salário ou benefício do
      tomador, para o pagamento das prestações do empréstimo – desconto em
      folha de pagamento – nos termos da legislação em vigor.
    confianca: verbatim
    fonte: "Instruções 3040, pp. 20 e 21"

  - id: sub_0203
    notation: "0203"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "crédito pessoal - sem consignação em folha de pagam."
    rotulo_no_dado: "Crédito pessoal - sem consignação em folha de pagam."
    definition: >
      operações de empréstimos às pessoas físicas, sem vinculação com
      aquisição de bem ou serviço e sem retenção de parcela do salário ou
      benefício do tomador para o pagamento das prestações do empréstimo
    confianca: verbatim
    fonte: "Instruções 3040, p. 21"
    scopeNote: >
      Inclui a antecipação do saque-aniversário do FGTS, que as Instruções
      mandam informar nesta submodalidade.

  - id: sub_0204
    notation: "0204"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "crédito rotativo vinculado a cartão de crédito"
    rotulo_no_dado: "Crédito rotativo vinculado a cartão de crédito"
    definition: >
      saldo devedor remanescente após o vencimento da fatura, equivalente à
      diferença entre o valor total da fatura e o valor pago pelo tomador, aí
      incluídos os juros calculados até o final do mês
    confianca: verbatim
    fonte: "Instruções 3040, p. 21"
    scopeNote: "Uma das cinco submodalidades de cartão. Ver avisos_gerais.cartao_de_credito_em_tres_modalidades."

  - id: sub_0207
    notation: "0207"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "vendor"
    rotulo_no_dado: "Vendor"
    confianca: lacuna
    fonte: "Anexo 3 (nome); ausente da tabela de Empréstimos das Instruções, p. 20"
    aviso: >
      A submodalidade existe no Anexo 3 e no dado, mas as Instruções não a
      listam em Empréstimos. Existe definição de vendor em Financiamentos
      (0404). Ela não foi copiada para cá, porque aplicar a definição de outra
      modalidade seria inferência.

  - id: sub_0208
    notation: "0208"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "compror"
    rotulo_no_dado: "Compror"
    confianca: lacuna
    fonte: "Anexo 3 (nome); ausente da tabela de Empréstimos das Instruções, p. 20"
    aviso: >
      Mesma situação de 0207. Existe definição de compror em Financiamentos
      (0405), não aplicada aqui.

  - id: sub_0209
    notation: "0209"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "ARO - adiantamento de receitas orçamentárias"
    rotulo_no_dado: "ARO - adiantamento de receitas orçamentárias"
    definition: >
      operações de crédito por antecipação de receita ao setor público
    confianca: verbatim
    fonte: "Instruções 3040, p. 21"

  - id: sub_0210
    notation: "0210"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "cartão de crédito – compra, fatura parcelada ou saque financiados pela instituição emitente do cartão"
    rotulo_no_dado: "Cartão de crédito - compra, fatura parcelada ou saque financiado pela instituição financeira emitente do cartão"
    definition: >
      crédito parcelado financiado pelo emissor do cartão, com cobrança de
      encargos financeiros. Essas operações podem estar vinculadas a saques,
      ao parcelamento de compras ou ao parcelamento de faturas de cartão de
      crédito.
    confianca: verbatim
    fonte: "Instruções 3040, p. 22"
    scopeNote: "Uma das cinco submodalidades de cartão."

  - id: sub_0211
    notation: "0211"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "home equity"
    rotulo_no_dado: "Home Equity"
    definition: >
      empréstimos a pessoas físicas, garantidos por hipoteca ou por alienação
      fiduciária de bens imóveis residenciais, sem vinculação a aquisição de
      bens
    confianca: verbatim
    fonte: "Instruções 3040, p. 22"
    garantia_na_definicao: "hipoteca ou alienação fiduciária de imóvel residencial"

  - id: sub_0212
    notation: "0212"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "microcrédito"
    rotulo_no_dado: "Microcrédito"
    definition: >
      Deve ser utilizada exclusivamente para operações de Microcrédito
      Produtivo Orientado disciplinados pela Resolução n° 4.854, de 24 de
      setembro de 2020.
    confianca: verbatim
    fonte: "Instruções 3040, p. 22"
    scopeNote: >
      Só o microcrédito produtivo orientado. O microcrédito que não é
      produtivo orientado vai para a submodalidade natural da operação.

  - id: sub_0213
    notation: "0213"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "cheque especial"
    rotulo_no_dado: "Cheque especial"
    definition: >
      operações de crédito vinculadas à conta corrente, nas quais determinado
      limite de crédito é disponibilizado aos clientes para utilização de
      acordo com suas conveniências, sem necessidade de comunicação prévia à
      instituição financeira
    confianca: verbatim
    fonte: "Instruções 3040, pp. 23 e 24"
    historyNote: "Substituiu, com 0214, a antiga 0201 'cheque especial e conta garantida' (nota a2 da planilha de equivalência)."

  - id: sub_0214
    notation: "0214"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "conta garantida"
    rotulo_no_dado: "Conta Garantida"
    definition: >
      operações de crédito rotativo, nas quais determinado limite de crédito é
      disponibilizado para utilização pelo cliente, através da simples
      movimentação da conta corrente e/ou solicitação formal à instituição
      financeira. As operações classificadas nessa modalidade não devem ter
      data definida para a amortização do saldo devedor, exceto a
      estabelecida para vigência do contrato
    confianca: verbatim
    fonte: "Instruções 3040, p. 24"
    historyNote: "Substituiu, com 0213, a antiga 0201 (nota a2 da planilha de equivalência)."

  - id: sub_0215
    notation: "0215"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "capital de giro com prazo de vencimento até 365 d"
    altLabel_pt:
      - "capital de giro com prazo de vencimento inferior até 365 d"   # PT: grafia da tabela das Instruções / EN: spelling in the Instructions table
    rotulo_no_dado: "Capital de giro com prazo de vencimento até 365 dias"
    definition: >
      operações de crédito voltadas para o financiamento de curto prazo (igual
      ou inferior a 365 dias) das pessoas jurídicas, vinculadas às
      necessidades de capital de giro e a um contrato específico que
      estabeleça prazos, taxas e garantias
    confianca: verbatim
    fonte: "Instruções 3040, p. 24"
    historyNote: "Substituiu a antiga 0205, com prazo inferior a 30 dias (notas a1 e a2 da planilha de equivalência)."

  - id: sub_0216
    notation: "0216"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "capital de giro com prazo vencimento superior 365 d"
    rotulo_no_dado: "Capital de giro com prazo de vencimento superior a 365 dias"
    definition: >
      operações de crédito voltadas para o financiamento de médio e longo
      prazo (superior a 365 dias) das pessoas jurídicas, vinculadas às
      necessidades de capital de giro e a um contrato específico que
      estabeleça prazos, taxas e garantias
    confianca: verbatim
    fonte: "Instruções 3040, p. 24"
    historyNote: "Substituiu a antiga 0206 (notas a1 e a2 da planilha de equivalência)."

  - id: sub_0217
    notation: "0217"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "capital de giro rotativo"
    altLabel_pt:
      - "capital de giro com teto rotativo"      # PT: Anexo 3 e dado / EN: Anexo 3 and data
      - "capital de giro com crédito rotativo"   # PT: nome na inclusão, 2017 / EN: name at inclusion, 2017
    rotulo_no_dado: "Capital de giro com teto rotativo"
    definition: >
      operações de crédito voltadas para o financiamento de capital de giro,
      vinculadas a um contrato que estabeleça linha de crédito rotativo, de
      forma que, à medida que a empresa devedora amortize os empréstimos já
      tomados, o limite disponível para utilização seja restituído, e
      amortizações com datas predeterminadas, podendo ser facultado ao
      devedor repactuar o fluxo de pagamentos ao longo da vigência do
      contrato
    confianca: verbatim
    fonte: "Instruções 3040, p. 24"
    historyNote: "Incluída pela Carta-Circular 3.806/2017, a partir de mai/2017. Três nomes oficiais para o mesmo código."

  - id: sub_0218
    notation: "0218"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "cartão de crédito – não migrado"
    rotulo_no_dado: "Cartão de crédito - não migrado"
    definition: >
      operações anteriormente informadas na modalidade crédito rotativo
      vinculado a cartão de crédito, sem previsão de consignação em folha de
      pagamento, quando não forem liquidadas integralmente no vencimento do
      crédito rotativo vinculado a cartão de crédito e não tenha havido
      financiamento do saldo devedor nos prazos previstos na Resolução 4.549,
      de 26 de janeiro de 2017.
    confianca: verbatim
    fonte: "Instruções 3040, pp. 24 e 25"
    scopeNote: "Uma das cinco submodalidades de cartão."

  - id: sub_0250
    notation: "0250"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "recebíveis adquiridos"
    rotulo_no_dado: "Recebíveis adquiridos"
    definition: >
      operações relativas à compra de créditos decorrentes da negociação de
      bens e serviços mediante pagamento a prazo, onde os referidos créditos
      não estão devidamente identificados. Nessas operações, o cedente será
      informado como o cliente devedor da operação
    confianca: verbatim
    fonte: "Instruções 3040, p. 25"

  - id: sub_0290
    notation: "0290"
    tipo: submodalidade
    broader: mod_02
    prefLabel_pt: "financiamento de projeto"
    rotulo_no_dado: "Financiamento de projeto"
    confianca: lacuna
