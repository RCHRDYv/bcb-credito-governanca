  - id: mod_13
    notation: "13"
    tipo: modalidade
    prefLabel_pt: "Outros créditos"
    rotulo_no_dado: "Outros créditos"
    confianca: lacuna
    fonte: "Instruções 3040, p. 35 (a modalidade não tem definição própria, só as submodalidades)"
    scopeNote: >
      Em jun/2026, a modalidade soma R$ 795,5 bi, 10,42% da carteira ativa.
      Desse total, 74,8% é compra no cartão de crédito sem juros (1304) e
      21,2% são recebíveis adquiridos (1350). A submodalidade genérica, "outros
      com característica de crédito" (1399), é 1,8%.
    aviso: >
      Não confundir o nome com "categoria residual". A maior parte da
      modalidade é produto bem definido. Ver ontology/metricas.yml,
      avisos_gerais.outros_creditos_balde_de_supressao.

