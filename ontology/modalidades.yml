  - id: sub_1001
    notation: "1001"
    tipo: submodalidade
    broader: mod_10
    prefLabel_pt: "financiamento de TVM"
    rotulo_no_dado: "Financiamento de TVM"
    definition: >
      operações lançadas na rubrica 1.6.5.00.00-6 (1.6.5.00.00.00-2 a partir
      de jan/25)
    confianca: verbatim
    fonte: "Instruções 3040, p. 33"
    scopeNote: >
      Única submodalidade da modalidade 10. A definição é a da modalidade.
      Nos direitos por empréstimos de ações, o cliente informado são as
      câmaras e prestadores de serviços de compensação.
    aviso: >
      Modalidade muito pequena, que mudou de composição dentro do recorte.
      Medido em 2026-09-25: a carteira dos bancos zerou em abril de 2025, e
      uma fintech passa a operar a partir de agosto de 2025. Variação
      percentual e participação por segmento nesta modalidade refletem essa
      troca de quem opera, e não crescimento de mercado. O nome lembra o de
      Financiamentos imobiliários (09), e as duas modalidades não têm
      relação: aqui são títulos e valores mobiliários.

