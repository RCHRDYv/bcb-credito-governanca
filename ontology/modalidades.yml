    rotulo_no_dado: "Microcrédito"
    definition: >
      Deve ser utilizada exclusivamente para operações de Microcrédito
      Produtivo Orientado disciplinados pela Resolução n° 4.854, de 24 de
      setembro de 2020.
    confianca: verbatim
    fonte: "Instruções 3040, p. 27"

  - id: sub_0404
    notation: "0404"
    tipo: submodalidade
    broader: mod_04
    prefLabel_pt: "vendor"
    rotulo_no_dado: "Vendor"
    definition: >
      operações de financiamento de vendas baseadas no princípio da cessão de
      crédito, que permite à empresa tomadora do financiamento
      (fornecedor/vendedor) vender seus produtos a prazo, recebendo o
      pagamento à vista da instituição financeira. A empresa compradora
      assume o compromisso de efetuar o pagamento a prazo, destinado a
      liquidar a operação junto à instituição financeira. Em geral, a
      instituição financeira ficará com os direitos creditórios da empresa
      vendedora, à qual caberá o risco da operação. O registro dessas
      operações é efetuado tendo como cliente o sacado, sendo o
      cedente/interveniente reportado na informação adicional 0201
    confianca: verbatim
    fonte: "Instruções 3040, pp. 27 e 28"

  - id: sub_0405
    notation: "0405"
