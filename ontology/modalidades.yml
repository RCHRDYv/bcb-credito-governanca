    rotulo_no_dado: "Financiamento habitacional \x96 exceto SFH"
    definition: >
      financiamento para aquisição ou construção de unidades habitacionais com
      taxas de juros livremente pactuadas entre a instituição financeira e o
      mutuário
    confianca: verbatim
    fonte: "Instruções 3040, p. 32"
    aviso: >
      O rótulo no dado contém o caractere de controle U+0096, invisível na
      maioria das telas, no lugar do traço. É o traço do Windows (byte 0x96)
      gravado com a codificação errada na origem. Comparar com "Financiamento
      habitacional – exceto SFH" ou com hífen falha em silêncio: medido em
      2026-09-21, um join com o rótulo limpo perde 179.292 linhas, sem erro.
      O staging precisa normalizar esse caractere.

