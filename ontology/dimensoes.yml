# =============================================================================
# PT: Dimensões que existiam na V1 e saíram da V2. Ficam registradas porque
#     qualquer série que atravesse as versões perde esses recortes.
# EN: Dimensions that existed in V1 and are gone from V2. Recorded because any
#     series crossing versions loses these breakdowns.
# =============================================================================

dimensoes_removidas_na_v2:

  - id: dim_v1_sr
    coluna: sr
    prefLabel_pt: "Segmento da Resolução CMN 4.553/2017"
    definition: >
      Classificação prudencial das instituições financeiras em cinco níveis,
      de S1 a S5, definida por porte medido como Exposição sobre PIB e por
      relevância de atividade internacional.
    confianca: parafraseado
    fonte: "Metodologia V1, seção 4.b"
    scopeNote: >
      Removida na V2. Traz nulo em 62.767 linhas da V1. Sem substituto: o
      segmento da V2 classifica por tipo de instituição, não por porte
      prudencial.

  - id: dim_v1_cnae_subclasse
    coluna: cnae_subclasse
    prefLabel_pt: "CNAE Subclasse"
    definition: >
      CNAE no nível máximo de desagregação, de sete dígitos, divulgado apenas
      quando a combinação CNAE Subclasse, UF e Porte tinha mais de 5 CNPJs no
      cadastro da Receita Federal. Abaixo disso era reportada a Seção.
    confianca: verbatim
    fonte: "Metodologia V1, seção 4.h"
    scopeNote: >
      Removida na V2, que só traz a Seção. É a maior perda de granularidade
      entre as versões, e tem uma regra de supressão própria, essa sim
      documentada, ao contrário do sentinela -1. A supressão foi medida em
      2026-09-23: atinge 989.730 das 25.227.055 linhas de PJ, 3,9%, e usa o
      mesmo marcador "-" que a coluna usa para as linhas de PF, onde o sentido
      é outro. São 1.261 subclasses distintas divulgadas, prefixadas por
      "PJ - ".
