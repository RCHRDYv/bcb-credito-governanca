<!doctype html>
<!--

      só o idioma, os metadados e o ponto de montagem. Não há script nem
      estilo embutido, para a política de segurança de conteúdo da #68 não
      precisar de exceção.

      script or style, so the #68 content security policy needs no exception.
-->

    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Crédito PJ</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
