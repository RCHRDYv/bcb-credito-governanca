# =============================================================================
# PT: Contrato dos arquivos que o site do dashboard lê (issue #60).
#
#     O site não tem banco, conexão nem credencial (ADR 0016). Ele lê arquivos
#     JSON exportados dos marts de apresentação (ADR 0007) na máquina local,
#     pela exportação da #66. Este arquivo é a fonte única do que cada JSON
#     traz: a exportação lê daqui o que exportar, e o CI reprova o arquivo que
#     sair do contrato. A arquitetura, em docs/dashboard/arquitetura.md, resume
#     por arquivo e aponta para cá, sem repetir as colunas.
#
#     Três regras:
#     - Só entra coluna que alguma visão usa. Coluna nova entra aqui antes de
#       entrar na exportação.
#     - Os números vão sem formatação: fração de 0 a 1 e reais em reais. A
#       formatação brasileira é feita só no site (RF-G10).
#     - Toda coluna aponta para a definição: um conceito da ontologia, que é a
#       fonte da verdade, ou o ADR que fixou a regra. A definição não é
#       repetida aqui.
#
# EN: Contract for the files the dashboard site reads. The site has no
#     database, connection or credential; it reads JSON files exported locally
#     from the presentation marts. This file is the single source of what each
#     JSON carries: the export reads it, and CI fails any file outside it. Only
#     columns a view uses, raw numbers (formatting happens in the site), and
#     every column points to its definition in the ontology or in an ADR.
# =============================================================================

versao: 1
destino: dashboard/public/data/

# -----------------------------------------------------------------------------
# PT: Forma de cada JSON. Por coluna, e não por linha: o nome da coluna não se
#     repete a cada linha, e o dataset do ECharts lê essa forma direto.
# EN: Shape of each JSON. Column-oriented, so names are not repeated per row,
#     and ECharts datasets read it directly.
# -----------------------------------------------------------------------------
formato:
  codificacao: utf-8
  exemplo: '{"arquivo": "decisao.json", "data_base": "2026-07-31", "colunas": {"uf": ["SP", "MG"], "carteira_ativa": [1.0e11, 4.2e10]}}'
  data_base: "A data-base da exportação: o último mês do SCR no mrt_decisao. É a mesma em todos os arquivos, inclusive nos que trazem vários meses."
  precisao: "Reais em reais inteiros. Frações, diferenças, variações e índices com 6 casas decimais. Os demais números são inteiros."
  gravacao: "Uma coluna por linha do arquivo, para o diff da PR mostrar qual coluna mudou. Rodar de novo com o mesmo dado produz o mesmo arquivo, byte a byte."
  datas: "Texto no formato AAAA-MM-DD. Mês sem dia, como o retrato do CNPJ, no formato AAAA-MM."
  nulo: "null do JSON. Só onde a coluna diz nulo: true."

# -----------------------------------------------------------------------------
# PT: O que o número é, e como o site o mostra.
# EN: What each number is, and how the site shows it.
# -----------------------------------------------------------------------------
unidades:
  reais: "Valor em reais, sem escala. O site mostra como R$ 485,5 bi."
  reais_por_empresa: "Reais divididos por empresas ativas. O site mostra como R$ 1,2 mi por empresa."
  fracao: "Razão de 0 a 1, sempre razão de somas. O site mostra como 0,93%."
  diferenca_de_fracao: "Diferença entre duas frações. O site mostra como +0,15 p.p."
  variacao_relativa: "Razão menos um. O site mostra como +4,2%."
  indice: "Razão sem unidade, em que 1 é a referência. O site mostra com duas casas."
  media_de_fracoes: "Média de frações de cada caso, e não razão de somas, como o erro percentual médio do backtest. O site mostra como 1,2%."
  empresas: "Contagem de empresas."
  contagem: "Contagem de outra coisa, dita na definição da coluna."
  meses: "Número inteiro de meses."
  data: "Data no formato AAAA-MM-DD."
  mes: "Mês no formato AAAA-MM."
  texto: "Rótulo ou código, mostrado como vem."
  booleano: "Verdadeiro ou falso."

# -----------------------------------------------------------------------------
# PT: Chaves que a exportação lê, além das colunas (#66):
#     - ordem: as colunas do grão, que fixam a ordem das linhas;
#     - onde: o filtro em SQL, sobre o próprio mart;
#     - ultimo_mes: só a data-base da exportação;
#     - meses: quantos meses, contando do último para trás.
#     O filtro em texto continua ao lado, para quem lê.
# EN: Keys the export reads besides the columns: row order, SQL filter, last
#     month only, and how many months back from the last one.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# PT: Os arquivos das visões. Os da visão 3 entraram com a #27, na v0.2, e
#     não saem de um mart: o script da previsão os grava, com a chave
#     gerado_por, e a exportação só os lê do disco para o manifesto. O
#     mrt_reconciliacao_versoes fica fora, porque nenhuma visão o usa.
# EN: The views' files. View 3's come from the forecast script (gerado_por),
#     not from a mart; the export only reads them from disk for the manifest.
# -----------------------------------------------------------------------------
arquivos:

  - arquivo: decisao.json
    origem: mrt_decisao
    grao: "UF e modalidade, só cliente PJ, no último mês do SCR"
    filtro: "Nenhum. Entram também as células não avaliadas, com o motivo."
    ordem: [codigo_modalidade, uf]
    visoes: [1, 2, 4]
    colunas:
      - {nome: data_base, tipo: string, unidade: data, nulo: false, definicao: "ontology/dimensoes.yml#dim_data_base"}
      - {nome: data_base_anterior, tipo: string, unidade: data, nulo: false, definicao: "ADR 0014, decisão 3"}
      - {nome: uf, tipo: string, unidade: texto, nulo: false, definicao: "ontology/dimensoes.yml#dim_uf"}
      - {nome: codigo_modalidade, tipo: string, unidade: texto, nulo: false, definicao: "ontology/modalidades.yml"}
      - {nome: modalidade, tipo: string, unidade: texto, nulo: false, definicao: "ontology/modalidades.yml"}
      - {nome: carteira_ativa, tipo: number, unidade: reais, nulo: false, definicao: "ontology/metricas.yml#carteira_ativa"}
      - {nome: empresas, tipo: integer, unidade: empresas, nulo: false, definicao: "ontology/fontes_externas.yml#estoque_reconstruido"}
      - {nome: carteira_por_empresa, tipo: number, unidade: reais_por_empresa, nulo: false, definicao: "ADR 0014, decisão 1"}
      - {nome: mediana_carteira_por_empresa, tipo: number, unidade: reais_por_empresa, nulo: true, definicao: "ADR 0014, decisão 1"}
      - {nome: indice_de_espaco, tipo: number, unidade: indice, nulo: true, definicao: "ADR 0014, decisão 1"}
      - {nome: ufs_acima_do_corte, tipo: integer, unidade: contagem, nulo: true, definicao: "ADR 0014, decisão 7"}
      - {nome: taxa_inadimplencia, tipo: number, unidade: fracao, nulo: true, definicao: "ontology/metricas.yml#indicador_inadimplencia"}
      - {nome: taxa_inadimplencia_anterior, tipo: number, unidade: fracao, nulo: true, definicao: "ontology/metricas.yml#indicador_inadimplencia"}
      - {nome: variacao_taxa_inadimplencia, tipo: number, unidade: diferenca_de_fracao, nulo: true, definicao: "ADR 0014, decisão 3"}
      - {nome: taxa_pais, tipo: number, unidade: fracao, nulo: true, definicao: "ADR 0014, decisão 3"}
      - {nome: variacao_taxa_pais, tipo: number, unidade: diferenca_de_fracao, nulo: true, definicao: "ADR 0014, decisão 3"}
      - {nome: avaliada, tipo: boolean, unidade: booleano, nulo: false, definicao: "ADR 0014, decisão 2"}
      - {nome: motivo_nao_avaliada, tipo: string, unidade: texto, nulo: true, definicao: "ADR 0014, decisão 7"}
      - {nome: quadrante, tipo: string, unidade: texto, nulo: false, definicao: "ADR 0014, decisão 4", valores: ["entrar", "observar", "manter", "não entrar", "não avaliada"]}
      - {nome: custo_de_nao_entrar, tipo: number, unidade: reais, nulo: true, definicao: "ADR 0014, decisão 5"}
      - {nome: custo_do_risco, tipo: number, unidade: reais, nulo: true, definicao: "ADR 0014, decisão 5"}
      - {nome: distancia_ap_inadimplencia, tipo: number, unidade: diferenca_de_fracao, nulo: true, definicao: "ADR 0014, decisão 6"}
      - {nome: variacao_distancia, tipo: number, unidade: diferenca_de_fracao, nulo: true, definicao: "ADR 0014, decisão 6"}
      - {nome: variacao_distancia_pais, tipo: number, unidade: diferenca_de_fracao, nulo: true, definicao: "ADR 0014, decisão 6"}
      - {nome: alerta_antecipado, tipo: boolean, unidade: booleano, nulo: false, definicao: "ADR 0014, decisão 6"}

  - arquivo: carteira_mensal_pj.json
    origem: mrt_carteira_mensal
    grao: "Mês, UF e modalidade, só cliente PJ"
    filtro: >
      cliente = 'PJ', nos 31 meses mais recentes. A faixa saiu da medida de
      tamanho da #66 contra o orçamento do RNF-03 (decidido em 2026-09-27):
      com 31 meses, a série inteira da V2 desde jan/2024, a visão 2 carrega
      228,8 KB comprimidos, dentro dos 300 KB. O número é fixo: a cada mês
      novo, o mais antigo sai, e o peso não cresce.
    onde: "cliente = 'PJ'"
    meses: 31
    ordem: [data_base, codigo_modalidade, uf]
    visoes: [2]
    colunas:
      - {nome: data_base, tipo: string, unidade: data, nulo: false, definicao: "ontology/dimensoes.yml#dim_data_base"}
      - {nome: uf, tipo: string, unidade: texto, nulo: false, definicao: "ontology/dimensoes.yml#dim_uf"}
      - {nome: codigo_modalidade, tipo: string, unidade: texto, nulo: false, definicao: "ontology/modalidades.yml"}
      - {nome: modalidade, tipo: string, unidade: texto, nulo: false, definicao: "ontology/modalidades.yml"}
      - {nome: carteira_ativa, tipo: number, unidade: reais, nulo: false, definicao: "ontology/metricas.yml#carteira_ativa"}
      - {nome: carteira_inadimplencia, tipo: number, unidade: reais, nulo: false, definicao: "ontology/metricas.yml#carteira_inadimplencia"}
      - {nome: ativo_problematico, tipo: number, unidade: reais, nulo: false, definicao: "ontology/metricas.yml#ativo_problematico"}
      - {nome: taxa_inadimplencia, tipo: number, unidade: fracao, nulo: true, definicao: "ontology/metricas.yml#indicador_inadimplencia"}
      - {nome: taxa_ativo_problematico, tipo: number, unidade: fracao, nulo: true, definicao: "ontology/metricas.yml#indicador_ativo_problematico"}
      - {nome: distancia_ap_inadimplencia, tipo: number, unidade: diferenca_de_fracao, nulo: true, definicao: "ADR 0014, decisão 6"}
      - {nome: variacao_taxa_inadimplencia_6m, tipo: number, unidade: diferenca_de_fracao, nulo: true, definicao: "ADR 0014, decisão 3"}
      - {nome: criterio_ativo_problematico, tipo: string, unidade: texto, nulo: false, definicao: "ontology/dimensoes.yml#criterio_ativo_problematico"}
      - {nome: janela_6m_cruza_quebra_ativo_problematico, tipo: boolean, unidade: booleano, nulo: false, definicao: "ontology/dimensoes.yml#criterio_ativo_problematico"}

  - arquivo: carteira_por_uf.json
    origem: mrt_carteira_por_uf
    grao: "UF, no último mês do SCR"
    filtro: "data_base igual à do decisao.json, para as duas fontes da visão 1 falarem do mesmo mês."
    nota: >
      É a visão 1 com todas as modalidades. O denominador e as razões são os
      do ADR 0014, com os mesmos nomes de coluna do decisao.json, e a tela
      trata os dois arquivos do mesmo jeito. Até a #69 o arquivo trazia os
      dois denominadores que o ADR descartou, todas as matrizes e as sem MEI
      (decidido em 2026-10-01). Traz também o crédito que faltaria para a
      UF chegar à mediana, como o custo de não entrar do decisao.json, e a
      participação da UF na carteira PJ do país, para a tela mostrar o
      tamanho de cada mercado e o da oportunidade (revisão da Tela 1, em
      2026-10-01). A validação confere, UF por UF, que as empresas são as
      mesmas do decisao.json, que a carteira PJ é a soma das modalidades
      dele, e as contas da mediana, do índice, do custo e da participação.
    ultimo_mes: true
    ordem: [uf]
    visoes: [1]
    colunas:
      - {nome: data_base, tipo: string, unidade: data, nulo: false, definicao: "ontology/dimensoes.yml#dim_data_base"}
      - {nome: uf, tipo: string, unidade: texto, nulo: false, definicao: "ontology/dimensoes.yml#dim_uf"}
      - {nome: carteira_pj, tipo: number, unidade: reais, nulo: false, definicao: "ontology/metricas.yml#carteira_ativa"}
      - {nome: empresas, tipo: integer, unidade: empresas, nulo: false, definicao: "ontology/fontes_externas.yml#estoque_reconstruido"}
      - {nome: carteira_por_empresa, tipo: number, unidade: reais_por_empresa, nulo: false, definicao: "ADR 0014, decisão 1"}
      - {nome: mediana_carteira_por_empresa, tipo: number, unidade: reais_por_empresa, nulo: false, definicao: "ADR 0014, decisão 1"}
      - {nome: indice_de_espaco, tipo: number, unidade: indice, nulo: false, definicao: "ADR 0014, decisão 1"}
      - {nome: custo_de_nao_entrar, tipo: number, unidade: reais, nulo: true, definicao: "ADR 0014, decisão 5"}
      - {nome: participacao_na_carteira_pj, tipo: number, unidade: fracao, nulo: false, definicao: "ontology/metricas.yml#carteira_ativa"}
      - {nome: retrato_do_cnpj, tipo: string, unidade: mes, nulo: false, definicao: "ontology/fontes_externas.yml#cnpj_aberto"}
      - {nome: meses_ate_o_retrato, tipo: integer, unidade: meses, nulo: false, definicao: "ADR 0009"}

  - arquivo: limites_do_dado.json
    origem: mrt_limites_do_dado
    grao: "Mês"
    filtro: "Nenhum."
    ordem: [data_base]
    visoes: [4]
    colunas:
      - {nome: data_base, tipo: string, unidade: data, nulo: false, definicao: "ontology/dimensoes.yml#dim_data_base"}
      - {nome: parcela_carteira_contagem_suprimida, tipo: number, unidade: fracao, nulo: false, definicao: "ontology/metricas.yml#numero_de_operacoes"}
      - {nome: parcela_recortes_contagem_suprimida, tipo: number, unidade: fracao, nulo: false, definicao: "ontology/metricas.yml#numero_de_operacoes"}
      - {nome: operacoes_limite_inferior, tipo: integer, unidade: contagem, nulo: true, definicao: "ontology/metricas.yml#numero_de_operacoes"}
      - {nome: parcela_carteira_conformacao_ambigua, tipo: number, unidade: fracao, nulo: false, definicao: "ADR 0003"}
      - {nome: parcela_carteira_conformacao_inferida, tipo: number, unidade: fracao, nulo: false, definicao: "ADR 0003"}
      - {nome: diferenca_v2_sobre_v1, tipo: number, unidade: variacao_relativa, nulo: false, definicao: "ontology/dimensoes.yml#divergencia_entre_versoes"}
      - {nome: criterio_ativo_problematico, tipo: string, unidade: texto, nulo: false, definicao: "ontology/dimensoes.yml#criterio_ativo_problematico"}
      - {nome: ativo_problematico_comparavel_com_mes_anterior, tipo: boolean, unidade: booleano, nulo: false, definicao: "ontology/dimensoes.yml#criterio_ativo_problematico"}
      - {nome: granularidade_da_publicacao, tipo: string, unidade: texto, nulo: false, definicao: "ontology/dimensoes.yml#granularidade_da_publicacao"}
      - {nome: divergencia_entre_versoes, tipo: string, unidade: texto, nulo: false, definicao: "ontology/dimensoes.yml#divergencia_entre_versoes"}
      - {nome: quebras_no_mes, tipo: string, unidade: texto, nulo: true, definicao: "ontology/dimensoes.yml#dim_data_base"}

  - arquivo: erro_da_reconstrucao.json
    origem: mrt_erro_da_reconstrucao
    grao: "Retrato do CNPJ e UF"
    filtro: "Nenhum."
    ordem: [retrato, uf]
    visoes: [4]
    colunas:
      - {nome: retrato, tipo: string, unidade: mes, nulo: false, definicao: "ontology/fontes_externas.yml#cnpj_aberto"}
      - {nome: data_de_corte, tipo: string, unidade: data, nulo: false, definicao: "ontology/fontes_externas.yml#data_do_retrato_nao_e_fim_de_mes"}
      - {nome: uf, tipo: string, unidade: texto, nulo: false, definicao: "ontology/dimensoes.yml#dim_uf"}
      - {nome: empresas_ativas_real, tipo: integer, unidade: empresas, nulo: false, definicao: "ontology/fontes_externas.yml#empresa_ativa"}
      - {nome: empresas_ativas_reconstruida, tipo: integer, unidade: empresas, nulo: false, definicao: "ontology/fontes_externas.yml#estoque_reconstruido"}
      - {nome: erro_relativo, tipo: number, unidade: variacao_relativa, nulo: false, definicao: "ADR 0009"}

  - arquivo: projecao_da_carteira.json
    origem: mrt_carteira_mensal
    gerado_por: scripts/analises/previsao_da_carteira.py
    grao: "Recorte e mês: o país, as 13 modalidades e as 27 UFs, nos 31 meses realizados e nos 3 projetados"
    filtro: >
      cliente = 'PJ'. O script soma a carteira ativa do mart por recorte, sem
      calcular razão, escolhe o modelo de cada recorte pelo backtest e projeta
      os três meses seguintes à data-base, com intervalo de 80% (ADR 0023).
    ordem: [tipo_de_recorte, recorte, data_base]
    visoes: [3]
    colunas:
      - {nome: tipo_de_recorte, tipo: string, unidade: texto, nulo: false, definicao: "ADR 0023, decisão 1", valores: ["modalidade", "pais", "uf"]}
      - {nome: recorte, tipo: string, unidade: texto, nulo: false, definicao: "ADR 0023, decisão 1"}
      - {nome: data_base, tipo: string, unidade: data, nulo: false, definicao: "ontology/dimensoes.yml#dim_data_base"}
      - {nome: realizado, tipo: number, unidade: reais, nulo: true, definicao: "ontology/metricas.yml#carteira_ativa"}
      - {nome: projecao, tipo: number, unidade: reais, nulo: true, definicao: "ADR 0023, decisão 4"}
      - {nome: limite_inferior, tipo: number, unidade: reais, nulo: true, definicao: "ADR 0023, decisão 4"}
      - {nome: limite_superior, tipo: number, unidade: reais, nulo: true, definicao: "ADR 0023, decisão 4"}
      - {nome: modelo, tipo: string, unidade: texto, nulo: false, definicao: "ADR 0023, decisão 2", valores: ["deriva", "holt_amortecido", "ingenuo", "ingenuo_sazonal"]}

  - arquivo: backtest_da_projecao.json
    origem: mrt_carteira_mensal
    gerado_por: scripts/analises/previsao_da_carteira.py
    grao: "Recorte, modelo candidato e horizonte de 1 a 3 meses"
    filtro: >
      As medidas de cada candidato nas origens do backtest: o MASE na janela de
      escolha, que decide o modelo, e o MASE, o MAPE e a cobertura do
      intervalo na janela de avaliação, que é o erro publicado (ADR 0023).
    ordem: [tipo_de_recorte, recorte, modelo, horizonte]
    visoes: [3]
    colunas:
      - {nome: tipo_de_recorte, tipo: string, unidade: texto, nulo: false, definicao: "ADR 0023, decisão 1", valores: ["modalidade", "pais", "uf"]}
      - {nome: recorte, tipo: string, unidade: texto, nulo: false, definicao: "ADR 0023, decisão 1"}
      - {nome: modelo, tipo: string, unidade: texto, nulo: false, definicao: "ADR 0023, decisão 2", valores: ["deriva", "holt_amortecido", "ingenuo", "ingenuo_sazonal"]}
      - {nome: horizonte, tipo: integer, unidade: meses, nulo: false, definicao: "ADR 0023, decisão 3"}
      - {nome: escolhido, tipo: boolean, unidade: booleano, nulo: false, definicao: "ADR 0023, decisão 3"}
      - {nome: mase_na_escolha, tipo: number, unidade: indice, nulo: false, definicao: "ADR 0023, decisão 3"}
      - {nome: mase, tipo: number, unidade: indice, nulo: false, definicao: "ADR 0023, decisão 3"}
      - {nome: mape, tipo: number, unidade: media_de_fracoes, nulo: false, definicao: "ADR 0023, decisão 3"}
      - {nome: cobertura, tipo: number, unidade: fracao, nulo: false, definicao: "ADR 0023, decisão 4"}

# -----------------------------------------------------------------------------
# PT: Arquivos que não saem de um mart.
# EN: Files that do not come from a mart.
# -----------------------------------------------------------------------------
auxiliares:

  - arquivo: ontologia.json
    origem: "ontology/*.yml, sem passar pelo Databricks"
    conteudo: >
      Um registro por conceito citado em alguma coluna acima, com id, rótulo
      em português, definição, fonte normativa, grau de confiança e nota de
      escopo. Entra também um registro por modalidade que aparece nos dados,
      com a definição do BCB, porque as colunas de modalidade apontam para o
      arquivo inteiro de modalidades (decidido em 2026-09-27, na #66). O
      registro da modalidade traz também a explicação em palavras comuns, com
      confiança e fonte próprias, que a tela mostra antes da definição
      oficial, quase sempre uma rubrica contábil (decidido em 2026-10-01, na
      #69). Junto
      vai o mapa de cada coluna para a sua definição, um conceito ou um ADR,
      que é o que deixa o site ir do número à definição (RF-G07). Gerado do
      YAML da ontologia, nunca digitado.
    visoes: [1, 2, 3, 4]

  - arquivo: manifesto.json
    origem: "A própria exportação"
    conteudo: >
      A data-base do último mês, os parâmetros da decisão lidos do
      dbt_project.yml (corte de materialidade, meses da tendência e mínimo de
      UFs) e, por arquivo, o número de linhas, o sha256 e as visões que o
      usam. As visões servem ao orçamento de carga, que soma o peso de cada
      visão sem ler este YAML. Não guarda data de geração: rodar de novo com
      o mesmo dado produz os mesmos arquivos, byte a byte, como a
      docs/recomendacao.md.
    visoes: [1, 2, 3, 4]

  - arquivo: geo/ufs.json
    origem: "API de malhas v3 do IBGE, malha territorial de 2022 na qualidade mínima (#67)"
    conteudo: >
      A malha das 27 UFs, uma feição por UF, com o código do IBGE (codarea)
      e a sigla, tirada de dim_uf na ontologia. A geometria vai como o IBGE
      publica, sem alteração, porque a qualidade mínima já cabe no orçamento
      de carga (decidido em 2026-10-01). No topo vão a fonte, o endereço, a
      licença, a nota sobre a geometria e o sha256 da malha crua. Fica em
      dashboard/public/geo/, é gravada por scripts/gerar_malha_do_dashboard.py
      e conferida no CI pela mesma validação dos dados.
    visoes: [1]
