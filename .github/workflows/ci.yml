# =============================================================================
# PT: Terceira camada de defesa. Os hooks de pre-commit rodam na máquina de
#     quem commita, o que significa que dependem de essa pessoa tê-los
#     instalado. Este workflow roda os mesmos verificadores no servidor, onde
#     não depende de configuração local de ninguém.
#
#     Além da segurança, ele roda as validações que NÃO precisam de
#     credencial: coerência da ontologia, coerência do seed de correspondência
#     e integridade do pré-registro das perguntas. As camadas que comparam com
#     o dado no Databricks continuam rodando só na máquina de quem tem acesso,
#     porque o projeto não guarda credencial do Databricks em segredo do
#     GitHub (ver issue #22 e ADR 0001).
#
# EN: Third layer of defence. Pre-commit hooks depend on the committer having
#     installed them; this workflow runs the same checks on the server. It also
#     runs the validations that need NO credential: ontology coherence,
#     correspondence seed coherence and question pre-registration integrity.
#     The layers that compare against data on Databricks run only on a machine
#     with access, because the project keeps no Databricks credential in
#     GitHub secrets (see issue #22 and ADR 0001).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PT: Permissão mínima. O workflow só precisa ler o código.
# EN: Least privilege. The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  qualidade-e-seguranca:
    name: Qualidade e segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # PT: Histórico completo para o gitleaks poder varrer os commits do PR.
          # EN: Full history so gitleaks can scan the PR's commits.
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rodar verificadores de pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # PT: no-commit-to-branch é guarda-corpo de desenvolvimento local:
          #     impede commit direto na main na máquina de quem desenvolve.
          #     No CI ele não faz sentido e quebra de propósito, porque após o
          #     merge o runner faz checkout justamente da main. Pular aqui não
          #     enfraquece nada: a proteção continua valendo onde ela atua, que
          #     é antes do commit sair da máquina.
          # EN: no-commit-to-branch is a local development guardrail: it blocks
          #     direct commits to main on the developer's machine. In CI it is
          #     meaningless and fails by construction, because after a merge the
          #     runner checks out main itself. Skipping it here weakens nothing:
          #     the protection still applies where it acts, which is before the
          #     commit ever leaves the machine.
          SKIP: no-commit-to-branch

  coerencia-dos-artefatos:
    name: Coerência dos artefatos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      # PT: Estrutura da ontologia: ids únicos, hierarquia coerente, definição
      #     presente onde a confiança não é lacuna, fonte em todo conceito.
      # EN: Ontology structure: unique ids, coherent hierarchy, definition where
      #     confidence is not a gap, source on every concept.
      - name: Ontologia de modalidades (estrutura)
        run: uv run python -m scripts.validar_modalidades --estrutura

      # PT: Estrutura das dimensões: id e coluna únicos, definição e fonte em
      #     todo conceito, aplica_a com valor previsto, valor não repetido.
      # EN: Dimension structure: unique ids and columns, definition and source
      #     everywhere, allowed aplica_a, no repeated values.
      - name: Ontologia de dimensões (estrutura)
        run: uv run python -m scripts.validar_dimensoes --estrutura

      # PT: Estrutura da ontologia das fontes externas (issue #25): ids
      #     únicos, fonte e confiança em tudo, códigos sem repetição, e cada
      #     fonte com data de referência declarada.
      # EN: External sources ontology structure: unique ids, source and
      #     confidence everywhere, no repeated codes, reference date declared.
      - name: Ontologia das fontes externas (estrutura)
        run: uv run python -m scripts.validar_fontes_externas

      # PT: Estrutura do seed: chave única e regras com valor permitido.
      # EN: Seed structure: unique key and rules with allowed values.
      - name: Seed de correspondência (estrutura)
        run: uv run python -m scripts.validar_correspondencia --estrutura

      # PT: As dimensões do modelo são geradas da ontologia, e não escritas à
      #     mão. Esta verificação é o que sustenta essa afirmação: regera os
      #     seeds e falha se o resultado diferir do que está versionado. Pega
      #     duas coisas, as duas silenciosas: alguém editar o CSV direto, e
      #     alguém mudar a ontologia sem regerar o seed.
      # EN: The model's dimensions are generated from the ontology, not
      #     hand-written. This check is what backs that claim: it regenerates
      #     the seeds and fails if the result differs from what is committed. It
      #     catches two silent mistakes: editing the CSV directly, and changing
      #     the ontology without regenerating the seed.
      - name: Seeds da ontologia em dia
        run: |
          uv run python -m scripts.gerar_seeds_da_ontologia
          git diff --exit-code -- 'dbt/seeds/ontologia_*.csv'

      # PT: Integridade do pré-registro: o conjunto v2 das perguntas precisa
      #     conter os 30 enunciados originais sem uma palavra alterada, e o v3
      #     só muda enunciado com a alteração declarada e o texto do v2 citado.
      # EN: Pre-registration integrity: the v2 question set must carry the 30
      #     original wordings with no word changed, and v3 may change a wording
      #     only with a declared change quoting the v2 text.
      - name: Perguntas do experimento
        run: uv run python -m scripts.validar_perguntas

      # PT: Critério de pronto da camada gold: cada pergunta e cada tela aponta
      #     os modelos que a respondem, ou a issue que a bloqueia. Perguntas só
      #     podem citar o esquema estrela, que é o que a IA consulta (ADR 0007).
      # EN: The gold layer's definition of done: every question and screen
      #     points to the models answering it, or the blocking issue. Questions
      #     may cite only the star schema, which is what the AI queries.
      - name: Cobertura da camada gold
        run: uv run python -m scripts.validar_cobertura

      # PT: Gabarito das perguntas: completo, com o tipo de acerto do
      #     pré-registro, SQL só de leitura sobre as tabelas que a cobertura
      #     lista, fontes que existem na ontologia, e todo SQL planejado pelo
      #     DuckDB sobre o esquema exportado, porque o experimento vai rodar
      #     lá (ADR 0015).
      # EN: Answer key: complete, with the pre-registered answer types,
      #     read-only SQL over the tables the coverage matrix lists, existing
      #     ontology sources, and every SQL planned by DuckDB over the exported
      #     schema, since the experiment will run there.
      - name: Gabarito das perguntas
        run: uv run python -m scripts.validar_gabarito

      # PT: Os JSON do site dentro do contrato (#66): colunas, tipos, nulos,
      #     grão, data-base, nenhum dado pessoal, e o ontologia.json e o
      #     manifesto.json iguais ao que a exportação monta. O arquivo que
      #     sair do contrato não chega ao site. A exportação roda só na
      #     máquina com acesso ao Databricks; aqui só se confere o resultado.
      # EN: The site's JSON files within the contract. The export runs only on
      #     a machine with Databricks access; CI checks the result.
      - name: Dados do dashboard
        run: uv run python -m scripts.validar_dados_do_dashboard

      # PT: Controle negativo: a validação precisa reprovar cópias estragadas
      #     de propósito, cada uma pelo motivo certo.
      # EN: Negative control: validation must reject deliberately broken
      #     copies, each for the right reason.
      - name: Dados do dashboard (controle negativo)
        run: uv run python -m scripts.validar_dados_do_dashboard --autoteste

      # PT: O método da previsão da carteira (#27, ADR 0023) com séries
      #     sintéticas de comportamento conhecido, sem Databricks: as janelas
      #     de escolha e de avaliação não se cruzam, a tendência ganha do
      #     ingênuo, e o intervalo contém a projeção.
      # EN: The portfolio forecast method on synthetic series, no Databricks.
      - name: Previsão da carteira (autoteste do método)
        run: uv run python -m scripts.analises.previsao_da_carteira --autoteste

      # PT: Carga do projeto dbt: Jinja, macros, referências entre modelos,
      #     fontes e testes. Não conecta no warehouse e não precisa de
      #     credencial (ver .github/dbt/profiles.yml). É o que pega um `ref`
      #     errado, uma macro inexistente ou um schema.yml mal formado antes do
      #     merge, já que o `dbt build` só roda na máquina com acesso.
      # EN: dbt project load: Jinja, macros, model references, sources and
      #     tests. It opens no warehouse connection and needs no credential. It
      #     catches a wrong `ref`, a missing macro or a malformed schema.yml
      #     before the merge, since `dbt build` only runs on a machine with
      #     access.
      #
      #     O dbt roda como ferramenta à parte, e não como dependência do
      #     projeto (ver pyproject.toml). As versões são fixas aqui para o CI
      #     não mudar de comportamento no dia em que o dbt lançar uma versão.
      # EN: dbt runs as a separate tool rather than a project dependency.
      #     Versions are pinned here so CI does not change behaviour the day dbt
      #     releases a new version.
      - name: Projeto dbt (carga e compilação)
        working-directory: dbt
        run: >
          uvx --from dbt-core==1.12.3 --with dbt-databricks==1.10.9
          dbt parse --profiles-dir ../.github/dbt --target ci --no-partial-parse

  # ---------------------------------------------------------------------------
  # PT: O que mudou (#105). O job do site é o mais longo do CI, e numa PR que
  #     não toca em dashboard/ ele testaria o mesmo site que já está na main.
  #     O site não lê nada fora da própria pasta: os dados dele ficam em
  #     dashboard/public/data/. Então ele roda só quando muda algo em
  #     dashboard/ ou neste workflow.
  #
  #     A comparação é com git diff, sem action de terceiros, e o workflow
  #     continua só com permissão de leitura. Na PR, a base é a da PR; no
  #     push na main, o commit anterior ao push. Sem base para comparar,
  #     roda tudo.
  # EN: What changed. The site job is CI's longest, and on a PR that does not
  #     touch dashboard/ it would test the same site main already has. The
  #     site reads nothing outside its folder, so it runs only when
  #     dashboard/ or this workflow changes. Plain git diff, no third-party
  #     action, read-only permissions. With no base to compare, run it all.
  # ---------------------------------------------------------------------------
  mudancas:
    name: O que mudou
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.site.outputs.site }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: O site mudou?
        id: site
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Sem base para comparar: roda o site."
            echo "site=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(dashboard/|\.github/workflows/ci\.yml$)'; then
            echo "O site ou o workflow mudou: roda o site."
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nada em dashboard/ nem no workflow: o site é o da main, e o job é pulado."
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # PT: O site do dashboard (issues #65 e #62, ADRs 0017 e 0018). Roda na pasta
  #     dashboard/ e confere, nesta ordem: o CSS gerado em dia com os tokens,
  #     lint e formatação, tipos pelo JSDoc, testes unitários, build, orçamento
  #     de carga (RNF-03), testes de ponta a ponta com axe no Chromium, no
  #     Firefox e no WebKit (RNF-04 a RNF-06) e o Lighthouse no celular e no
  #     computador (RNF-01 e RNF-02). Não usa segredo nenhum: a permissão do
  #     workflow continua só de leitura.
  #
  #     Num push na main, o último passo guarda o dist/ como o artefato que o
  #     job de publicação manda ao Pages (#68). É o mesmo dist/ que acabou de
  #     passar em todos os passos acima.
  # EN: The dashboard site. Tokens in sync, lint, JSDoc types, unit tests,
  #     build, load budget, end-to-end tests with axe on three engines, and
  #     Lighthouse on mobile and desktop. No secrets; the workflow stays
  #     read-only. On a push to main, the last step stores dist/ as the
  #     artifact the publishing job deploys: the same dist/ that just passed.
  # ---------------------------------------------------------------------------
  site-do-dashboard:
    name: Site do dashboard
    needs: mudancas
    if: needs.mudancas.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tokens em dia com o CSS gerado
        run: npm run tokens:check

      - name: Lint e formatação
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Orçamento de carga
        run: npm run budget

      - name: Instalar os navegadores dos testes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Testes de ponta a ponta com axe
        run: npm run test:e2e

      - name: Lighthouse
        run: npm run lighthouse

      - name: Guardar o site para a publicação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist

  # ---------------------------------------------------------------------------
  # PT: Publicação do site no GitHub Pages (#68, ADR 0016). Roda só num push
  #     na main e só depois que os três jobs acima passam, então o que vai ao
  #     ar é o dist/ que passou no CI inteiro. Um workflow à parte rodaria em
  #     paralelo ao CI, sem esperar os testes, porque a main não tem proteção
  #     de branch.
  #
  #     As permissões ficam neste job, e são só as duas que a publicação
  #     pede: pages: write, para criar a publicação, e id-token: write, para
  #     o Pages conferir que ela vem deste workflow. O token é o efêmero que
  #     o GitHub gera para cada execução, e o repositório não tem segredo
  #     nenhum. O ambiente github-pages só aceita publicação da main.
  #
  #     Quando o push não muda o site, o job dele é pulado e este também: o
  #     site no ar continua sendo o da última publicação, que é o mesmo (#105).
  # EN: GitHub Pages deployment. Runs only on a push to main, after the three
  #     jobs above pass, so what ships is the dist/ that passed all of CI.
  #     Permissions live in this job and are only the two deployment needs;
  #     the token is the per-run ephemeral one, and the repository holds no
  #     secret. The github-pages environment accepts deployments from main.
  #     When a push leaves the site unchanged, the site job is skipped and so
  #     is this one: the live site is already the same.
  # ---------------------------------------------------------------------------
  publicacao-do-site:
    name: Publicação no Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [qualidade-e-seguranca, coerencia-dos-artefatos, site-do-dashboard]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    # PT: uma publicação por vez, sem cancelar a que já começou
    # EN: one deployment at a time, never cancelling one in progress
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Publicar no Pages
        id: publicacao
        uses: actions/deploy-pages@v5
