# =============================================================================
# PT: O esquema estrela publicado (#45, ADR 0027). Lê o dataset público do
#     Hugging Face na revisão fixada em esquema_estrela/manifesto.json, sem
#     credencial nenhuma, e confere: sha256 pela API do Hub, só os arquivos
#     esperados, esquema, totais por período contra o manifesto e os SQL do
#     gabarito contra as respostas versionadas. É o que prova que o DuckDB lê
#     o esquema estrela direto do dataset.
#
#     Fica num workflow próprio, e não no ci.yml, por dois motivos: se o
#     Hugging Face sair do ar, só ele reprova; e mudar o ci.yml dispara o job
#     do site (#105), que leva mais de 10 minutos.
# EN: The published star schema. Reads the public Hugging Face dataset at the
#     pinned revision, with no credential, and checks hashes, file set,
#     schema, per-period totals and the answer key SQL. Its own workflow, not
#     ci.yml: a Hugging Face outage fails only this one, and changing ci.yml
#     triggers the 10-minute site job.
# =============================================================================

name: Esquema estrela publicado

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PT: Permissão mínima. O workflow só precisa ler o código.
# EN: Least privilege. The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  esquema-estrela-publicado:
    name: Esquema estrela publicado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Leitura do dataset e conferência
        run: uv run python -m scripts.analises.qa_esquema_estrela --origem hf
