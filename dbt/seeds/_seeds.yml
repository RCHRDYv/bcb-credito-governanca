# =============================================================================
# PT: Seeds do projeto. Nenhum é escrito à mão: todos são gerados por script
#     versionado a partir de fonte oficial, conforme o ADR 0003.
# EN: Project seeds. None is hand-written: all are generated by a versioned
#     script from an official source, per ADR 0003.
#
# PT: column_types fixa tudo como string de propósito. O código da
#     submodalidade tem zero à esquerda ("0101"), e qualquer inferência de
#     tipo numérico o destruiria em silêncio.
# EN: column_types pins everything to string on purpose. The sub-modality code
#     has a leading zero ("0101"), and numeric type inference would silently
#     destroy it.
# =============================================================================

version: 2

seeds:
  - name: correspondencia_modalidade_v2_v1
    description: >
      Correspondência das submodalidades da V2 para as modalidades da V1,
      gerada por scripts/gerar_seed_correspondencia.py a partir da planilha
      oficial Equivalencia_Modalidades.xlsx. A chave é código da
      submodalidade, tipo de cliente e origem dos recursos. Ver ADR 0003.
    config:
      column_types:
        codigo_submodalidade_v2: string
        modalidade_v2: string
        submodalidade_v2: string
        cliente: string
        origem: string
        modalidade_v1: string
        modalidade_v1_alternativa: string
        modalidade_v1_inferida: string
        regra: string
        ambiguidade: string
    columns:
      - name: codigo_submodalidade_v2
        description: "Código do Anexo 3, modalidade e subdomínio concatenados, com zero à esquerda."
        data_tests: [not_null]
      - name: modalidade_v2
        description: "Rótulo da modalidade como aparece no dado da V2."
        data_tests: [not_null]
      - name: submodalidade_v2
        description: "Rótulo da submodalidade como aparece no dado da V2, incluindo suas imperfeições."
        data_tests: [not_null]
      - name: cliente
        description: "PF ou PJ."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PF", "PJ"]
      - name: origem
        description: "Origem dos recursos, primeiro nível do Anexo 4, como aparece no dado."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Sem destinação específica", "Com destinação específica"]
      - name: modalidade_v1
        description: >
          Modalidade da V1 indicada pela planilha oficial. Vazia nas quatro
          combinações que a planilha não cobre, onde vale a coluna inferida.
      - name: modalidade_v1_alternativa
        description: >
          Segunda modalidade candidata. Preenchida no tratamento 2, em que a
          escolha depende da Natureza da operação, campo que o SCR.data não
          publica.
      - name: modalidade_v1_inferida
        description: >
          Inferência do projeto, usada só onde a planilha oficial não tem
          correspondência. Nunca sobrepõe a fonte oficial.
      - name: regra
        description: "base, tratamento_1, tratamento_2 ou ausente_na_planilha."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["base", "tratamento_1", "tratamento_2", "ausente_na_planilha"]
      - name: ambiguidade
        description: >
          Vazio quando a correspondência é determinística. natureza_nao_publicada
          quando depende de campo ausente no dado. ausente_na_planilha quando a
          tabela oficial não cobre a combinação.
        data_tests:
          - accepted_values:
              arguments:
                values: ["natureza_nao_publicada", "ausente_na_planilha"]
              config:
                where: "ambiguidade is not null and ambiguidade != ''"

  # ---------------------------------------------------------------------------
  # PT: Os dois seeds abaixo são a ontologia virando dado. Eles são gerados por
  #     scripts/gerar_seeds_da_ontologia.py e não devem ser editados à mão:
  #     qualquer correção entra no YAML da ontologia e o seed é regerado.
  # EN: The two seeds below are the ontology turned into data. They are
  #     generated by scripts/gerar_seeds_da_ontologia.py and must not be edited
  #     by hand: any fix goes into the ontology YAML and the seed is regenerated.
  # ---------------------------------------------------------------------------

  - name: ontologia_modalidade
    description: >
      Os 66 pares de modalidade e submodalidade do SCR.data V2, gerados de
      ontology/modalidades.yml. Traz o código do Anexo 3, o rótulo exato do
      dado, o nome oficial das Instruções de Preenchimento, a definição
      normativa e o nível de confiança dela.
    config:
      column_types:
        codigo_submodalidade: string
        codigo_modalidade: string
        modalidade: string
        submodalidade: string
        nome_oficial_modalidade: string
        nome_oficial_submodalidade: string
        definicao: string
        confianca: string
        fonte: string
    columns:
      - name: codigo_submodalidade
        description: "Código do Anexo 3, modalidade e subdomínio concatenados, com zero à esquerda."
        data_tests: [not_null, unique]
      - name: modalidade
        description: "Rótulo exato da coluna modalidade no dado. Chave de junção."
        data_tests: [not_null]
      - name: submodalidade
        description: >
          Rótulo exato da coluna submodalidade no dado, com as imperfeições
          preservadas. Só identifica a submodalidade em par com a modalidade.
        data_tests: [not_null]
      - name: definicao
        description: >
          Definição normativa, transcrita das Instruções de Preenchimento.
          Vazia nas quatro submodalidades marcadas como lacuna.
      - name: confianca
        description: "Nível de confiança da definição."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["verbatim", "parafraseado", "inferido", "lacuna"]

  - name: ontologia_dimensao
    description: >
      Os valores das sete dimensões enumeradas da V2, gerados de
      ontology/dimensoes.yml. Os valores das duas colunas polimórficas, porte e
      cnae_ocupacao, são expandidos por tipo de cliente e ganham rótulo
      desambiguado no formato que a V1 usava.
    config:
      column_types:
        dimensao: string
        cliente: string
        valor: string
        valor_desambiguado: string
        taxonomia: string
        aplica_a: string
        significado: string
        aviso: string
        definicao_da_dimensao: string
    columns:
      - name: dimensao
        description: "Nome da coluna do dado a que o valor pertence."
        data_tests: [not_null]
      - name: cliente
        description: >
          Preenchido apenas nas dimensões polimórficas, onde o par com o valor é
          que identifica a categoria. Nulo nas demais, onde o valor vale para os
          dois tipos de cliente.
      - name: valor
        description: "Rótulo exato do valor no dado."
        data_tests: [not_null]
      - name: valor_desambiguado
        description: >
          Chave da dimensão. Igual ao valor nas dimensões não polimórficas, e
          prefixado pelo tipo de cliente nas polimórficas.
        data_tests: [not_null]
      - name: taxonomia
        description: >
          A qual taxonomia o valor pertence. É o que distingue faixa de renda de
          porte de empresa dentro da mesma coluna.
        data_tests: [not_null]
      - name: definicao_da_dimensao
        description: >
          Definição normativa da dimensão a que o valor pertence, a mesma em
          todos os valores dela. É por esta coluna que o aviso da UF como
          domicílio ou sede chega ao mart.
        data_tests: [not_null]
      - name: aplica_a
        description: "Tipos de cliente em que o valor ocorre no dado, medido."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PF", "PJ", "PF e PJ"]

  - name: ontologia_quebra
    description: >
      As quebras datadas da série, geradas da lista quebras da dimensão
      data_base em ontology/dimensoes.yml. É a fonte das colunas de aviso da
      dim_tempo, e é por isso que nenhuma data de quebra fica escrita à mão no
      SQL dos marts.
    config:
      column_types:
        id: string
        data: string
        afeta: string
        descricao: string
        antes: string
        depois: string
        consequencia: string
        confianca: string
        fonte: string
    columns:
      - name: id
        description: "Identificador estável da quebra, usado pelos modelos que precisam de uma quebra específica."
        data_tests: [not_null, unique]
      - name: data
        description: "Primeiro mês afetado, como último dia do mês, no mesmo formato de data_base."
        data_tests: [not_null, unique]
      - name: antes
        description: "Como a série se comportava antes da quebra."
        data_tests: [not_null]
      - name: depois
        description: "Como a série se comporta a partir da quebra."
        data_tests: [not_null]
