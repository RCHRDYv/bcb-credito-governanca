# =============================================================================
# PT: Parâmetros do assistente de dados (#49, ADR 0029; #48, ADR 0030). O
#     pré-registro (evaluation/hipoteses.yml, execucao.fixado_antes_da_execucao)
#     manda fixar o modelo, o num_ctx, o limite de tokens da resposta e os
#     limites de linhas e de tempo antes do experimento.
#
#     A geração e os limites do SQL repetem o evaluation/selecao.yml, com o
#     qual a seleção dos modelos rodou; scripts.validar_selecao confere que
#     batem. Enquanto houver provisorio: true, a lista de modelos é a da
#     fumaça. O scripts.resumir_selecao troca a lista pelos dois modelos
#     escolhidos, apaga o provisorio, e o arquivo congela por errata no
#     evaluation/registro.yml.
#
#     A temperatura e as seeds já estão no pré-registro e são conferidas
#     contra ele por assistente.parametros.conferir_pre_registro().
#
# EN: Data assistant parameters. Generation settings and SQL limits repeat
#     evaluation/selecao.yml, checked by scripts.validar_selecao. While
#     provisorio is true, the model list is the smoke test's;
#     scripts.resumir_selecao swaps in the two chosen models, removes
#     provisorio, and the file is frozen by errata. Temperature and seeds are
#     pre-registered and checked.
# =============================================================================

provisorio: true

servidor:
  # PT: API nativa do Ollama, que aceita num_ctx, seed e o esquema JSON por
  #     requisição (decisão de 2026-10-08). A rota compatível com a OpenAI
  #     não aceita num_ctx por requisição.
  # EN: Ollama's native API, which takes num_ctx, seed and a JSON schema per
  #     request. The OpenAI-compatible route does not take num_ctx.
  endereco: "http://127.0.0.1:11434"
  tempo_maximo_em_segundos: 600

modelos:
  # PT: modelo provisório, só para a fumaça. A #48 escolhe os do experimento
  #     pelo gabarito, na condição A (ADR 0026), e o scripts.resumir_selecao
  #     troca esta lista pelos dois escolhidos, um por classe. O primeiro é
  #     o padrão; --modelo escolhe outro. O num_ctx e a razão de caracteres
  #     por token são de cada modelo, porque o tokenizador muda.
  #
  #     O num_ctx é o menor múltiplo de 4.096 que comporta a segunda chamada
  #     de D mais o limite da resposta (hipoteses.yml,
  #     execucao.contexto_do_modelo). A fumaça de 2026-10-08, com o
  #     qwen3:8b, mediu 38.923 tokens no maior prompt de D; com os 2.048 da
  #     resposta, os 40.960 de antes estouravam por 11.
  #
  #     A razão é a base da estimativa de tokens feita antes do envio: o
  #     Ollama corta o prompt grande em vez de recusar, e o
  #     prompt_eval_count pode deixar de fora o prefixo em cache. A fumaça
  #     mediu cerca de 3,1 caracteres por token em D; 3,0 erra para o lado
  #     de estimar tokens a mais.
  # EN: provisional model, smoke test only. #48 replaces this list with the
  #     two chosen models, one per class; the first is the default and
  #     --modelo picks another. num_ctx and the characters-per-token ratio
  #     are per model, since tokenizers differ.
  - nome: "qwen3:8b"
    num_ctx: 45056
    caracteres_por_token_na_estimativa: 3.0

geracao:
  # PT: do pré-registro / EN: pre-registered
  temperatura: 0.2
  seeds: [1, 2, 3, 4, 5]
  # PT: os do evaluation/selecao.yml (#48). O think desliga o modo de
  #     raciocínio, que gasta tokens da resposta e do contexto.
  # EN: those of evaluation/selecao.yml. think turns off reasoning mode.
  limite_de_tokens_da_resposta: 2048
  think: false
  esquema_json: true

sql:
  # PT: os do evaluation/selecao.yml (#48). A maior resposta do gabarito
  #     tem 64 linhas (Q23). Passando do limite, o resultado é cortado e o
  #     modelo é avisado (decisão de 2026-10-08).
  # EN: those of evaluation/selecao.yml. The largest answer key result has
  #     64 rows. Beyond the limit the result is cut and the model is told.
  limite_de_linhas: 100
  limite_de_tempo_em_segundos: 30
