  fct_empresas_ativas:
    descricao: "Empresas ativas no fim de cada mês, do cadastro do CNPJ: uma linha por data-base, UF, porte, grupo de natureza jurídica e MEI."
    colunas:
      data_base: "Último dia do mês de referência."
      uf: "Sigla da UF."
      porte_empresa: "Código do porte no CNPJ, com dois dígitos; pode ser nulo."
