      cnae_ocupacao_desambiguado: "Seção do CNAE ou natureza da ocupação, com o prefixo do tipo de cliente ('PF - ' ou 'PJ - ')."
      cliente: "Tipo de cliente: PF ou PJ."
      origem: "Origem dos recursos."
      indexador: "Indexador das operações, em seis categorias, como Prefixado e Pós-fixado."
