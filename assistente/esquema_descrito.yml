      carteira_ativa: "Saldo da carteira ativa do recorte, em reais."
      carteira_inadimplencia: "Saldo da carteira inadimplida do recorte, em reais."
      ativo_problematico: "Saldo do ativo problemático do recorte, em reais."
      modalidade_v1_efetiva: "Rótulo da modalidade correspondente na publicação antiga (V1), com o prefixo 'PF - ' ou 'PJ - '."
      origem_da_modalidade_v1: "Como a correspondência com a V1 foi obtida."

  fct_carteira_v1:
    descricao: "A carteira de crédito do SCR na publicação antiga (V1): uma linha por data-base, UF, tipo de cliente, modalidade da V1 e origem. Os saldos estão em reais."
    colunas:
