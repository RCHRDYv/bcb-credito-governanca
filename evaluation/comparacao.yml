            linha: {medida: carteira_inadimplida}
          - valor: maior_variacao_nos_outros_meses_pct
            linha: {medida: carteira_inadimplida}
    v1:
      - consulta: Q38_v1.sql
        verificar:
          - valor: variacao_na_quebra_pct
            linha: {medida: ativo_problematico}
          - valor: maior_variacao_nos_outros_meses_pct
            linha: {medida: ativo_problematico}
          - valor: variacao_na_quebra_pct
            linha: {medida: carteira_inadimplida}
          - valor: maior_variacao_nos_outros_meses_pct
            linha: {medida: carteira_inadimplida}

  Q39:
    unica:
      - consulta: Q39.sql
        verificar:
          - valor: diferenca_pct
            linha: ultima
          - valor: mes
            linha: {maior_em_modulo: mudanca_da_diferenca_pp}
          - valor: mudanca_da_diferenca_pp
            linha: {maior_em_modulo: mudanca_da_diferenca_pp}

  Q40:
    unica:
      - consulta: Q40.sql
        janelas:
          ultimo_mes:
            - valor: ambigua_no_ultimo_mes_pct
            - valor: inferida_no_ultimo_mes_pct
          recorte:
            - valor: ambigua_no_recorte_pct
            - valor: inferida_no_recorte_pct

  Q41:
    abstencao: so_rubrica
