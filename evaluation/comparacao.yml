      - consulta: Q32.sql
        verificar:
          - valor: participacao_da_modalidade_na_carteira_pct
            linha: primeira
          - lista: conjunto
            chave: codigo_submodalidade
            valores: [participacao_na_modalidade_pct]

  Q33:
    unica:
      - consulta: Q33.sql
        verificar:
          - lista: conjunto
            chave: porte_desambiguado
            valores:
              - uma_de: [carteira_ativa, participacao_no_cliente_pct]

  Q34:
    unica:
      - consulta: Q34.sql
        verificar:
          - valor: carteira_ativa

  Q35:
    unica:
      - consulta: Q35.sql
        verificar:
          - valor: meses_com_ocorrencia
          - valor: maior_carteira_mensal
          - valor: modalidade_v1_atribuida

  # ---------------------------------------------------------------------------
  # PT: Limites do dado e comparabilidade
  # EN: Data limits and comparability
  # ---------------------------------------------------------------------------
  Q36:
    unica:
      - consulta: Q36.sql
        janelas:
          ultimo_mes:
            - valor: carteira_sem_contagem_no_ultimo_mes_pct
          recorte:
            - valor: carteira_sem_contagem_no_recorte_pct

  Q37:
    unica:
      - consulta: Q37.sql
        verificar:
          - valor: operacoes_limite_inferior
          - valor: carteira_sem_contagem_pct

  Q38:
    v2:
      - consulta: Q38_v2.sql
        verificar:
          - valor: variacao_na_quebra_pct
            linha: {medida: ativo_problematico}
          - valor: maior_variacao_nos_outros_meses_pct
            linha: {medida: ativo_problematico}
