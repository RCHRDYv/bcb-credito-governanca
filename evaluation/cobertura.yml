# =============================================================================
# PT: Matriz de cobertura da camada gold. É o critério de pronto da issue #15:
#     cada pergunta do experimento e cada tela do dashboard precisa ter os
#     modelos que a respondem, ou a issue que ainda a bloqueia.
#
#     Arquivo separado de propósito: os conjuntos de perguntas são
#     pré-registro e não são tocados. Esta matriz diz COMO responder, e aquele arquivo diz O QUE foi
#     perguntado, antes de qualquer resultado.
#
#     Três regras, conferidas por scripts/validar_cobertura.py no CI:
#
#     1. As perguntas citam só o esquema estrela (dim_* e fct_*), porque é o
#        que a IA consulta no experimento, nas duas condições (ADR 0007). Uma
#        pergunta que só um mart de apresentação respondesse seria impossível
#        por construção para a IA.
#     2. As telas citam os marts de apresentação (mrt_*), que é o que o
#        dashboard exporta.
#     3. Toda entrada tem modelos, ou depende de uma issue, ou as duas coisas:
#        "depende_de" com modelos quer dizer que parte da resposta existe e o
#        denominador ou a fonte complementar ainda não.
#
#     Campo "limite": o que a resposta precisa declarar mesmo quando o modelo
#     existe. Não bloqueia, e vira ressalva no gabarito da issue #16.
#
# EN: Coverage matrix for the gold layer, issue #15's definition of done: every
#     experiment question and dashboard screen must list the models that answer
#     it, or the issue still blocking it. Questions cite only the star schema,
#     which is what the AI queries (ADR 0007); screens cite the presentation
#     marts. Kept separate from the pre-registered questions file on purpose.
# =============================================================================

perguntas:

  # ---------------------------------------------------------------------------
  # PT: Monitoramento e benchmark de mercado
  # EN: Market monitoring and benchmark
  # ---------------------------------------------------------------------------
  Q01: {modelos: [fct_carteira, dim_tempo]}
  Q02: {modelos: [fct_carteira, dim_modalidade, dim_tempo]}
  Q03: {modelos: [fct_carteira, dim_tempo]}
  Q04: {modelos: [fct_carteira, dim_segmento, dim_tempo]}
  Q05: {modelos: [fct_carteira, dim_uf]}

  # ---------------------------------------------------------------------------
  # PT: Risco e inadimplência
  # EN: Risk and default
  # ---------------------------------------------------------------------------
  Q06: {modelos: [fct_carteira, dim_modalidade]}
  Q07: {modelos: [fct_carteira, dim_modalidade, dim_tempo]}
  Q08:
    modelos: [fct_carteira, dim_modalidade, dim_tempo]
    limite: >
      No conjunto v3, a média é a dos últimos dois anos, que cabem no recorte.
      O v2 pedia cinco anos, e o recorte começa em jan/2024.
  Q09:
    modelos: [fct_carteira, dim_modalidade, dim_tempo]
    limite: "A distância entre as duas métricas muda de definição em jan/2025 (dim_tempo.criterio_ativo_problematico)."
  Q10: {modelos: [fct_carteira, dim_modalidade, dim_tempo]}

  # ---------------------------------------------------------------------------
  # PT: Expansão geográfica e priorização
  # EN: Geographic expansion and prioritisation
  # ---------------------------------------------------------------------------
  Q11:
    modelos: [fct_carteira, fct_populacao, dim_uf]
    limite: "População é estimativa anual do IBGE, com referência em 1º de julho, aplicada a todos os meses do ano."
  Q12:
    modelos: [fct_carteira, fct_populacao, dim_uf, dim_tempo]
    limite: "Doze meses atravessam dois anos de estimativa de população, e o ajuste usa a de cada ano."
  Q13: {modelos: [fct_carteira, dim_uf], depende_de: ["#38"]}
  Q14:
    modelos: [fct_carteira, fct_empresas_ativas, dim_uf, dim_natureza_juridica]
    limite: >
      UF é domicílio da pessoa ou sede da empresa, não local da operação
      (dim_uf.definicao_da_uf). O número de empresas é reconstruído de um
      retrato do CNPJ, com erro medido (ADR 0009).
  Q15: {modelos: [fct_carteira, dim_uf], depende_de: ["#38"]}

  # ---------------------------------------------------------------------------
  # PT: Modalidade e produto
  # EN: Modality and product
  # ---------------------------------------------------------------------------
  Q16:
    modelos: [fct_carteira, dim_modalidade, dim_tempo]
    limite: "No conjunto v3, a janela é de dois anos, que cabem no recorte. O v2 pedia três."
  Q17:
    modelos: [dim_modalidade, fct_carteira]
    limite: >
      Abstenção. Só a definição do home equity (0211) declara garantia, e o
      SCR.data não publica o campo de garantias. A dimensão prova a ausência,
      e o fato dá a única comparação possível, a do home equity com o
      restante da PF (errata de 2026-09-22).
  Q18:
    modelos: [fct_carteira, dim_modalidade]
    limite: "Só calculável nas linhas com contagem divulgada, que deixam de fora 6,71% da carteira (fct_carteira.contagem_suprimida)."
  Q19: {modelos: [fct_carteira, dim_modalidade]}

  # ---------------------------------------------------------------------------
  # PT: Concentração e competição
  # EN: Concentration and competition
  # ---------------------------------------------------------------------------
  Q20: {modelos: [fct_carteira, dim_segmento, dim_tempo]}
  Q21: {modelos: [fct_carteira, dim_segmento, dim_modalidade, dim_tempo]}

  # ---------------------------------------------------------------------------
  # PT: PIX e mudança estrutural
  # EN: PIX and structural change
  # ---------------------------------------------------------------------------
  Q22:
    modelos: [fct_pix, dim_tempo]
    limite: >
      Só o PIX liquidado no SPI; o liquidado nos livros do participante não
      está no dado. Pagador e recebedor somam o mesmo no total do país, e
      somar os dois dobra o volume. O recorte comum aos fatos tem 31 meses.
  Q23:
    modelos: [fct_carteira, fct_pix, dim_modalidade, dim_tempo]
    limite: "Coincidência no tempo não é causa, e 31 meses são pouca série."
  Q24:
    modelos: [fct_carteira, fct_pix, dim_uf]
    limite: >
      PIX é fluxo do mês e carteira é saldo, então a razão compara grandezas
      de natureza diferente. Por UF, o valor depende do lado (pagador ou
      recebedor), e a resposta precisa dizer qual usa.

  # ---------------------------------------------------------------------------
  # PT: Contexto econômico
  # EN: Economic context
  # ---------------------------------------------------------------------------
  Q25:
    modelos: [fct_carteira, fct_selic, dim_tempo]
    limite: >
      É a meta do Copom, e não a taxa efetiva (fct_selic, ADR 0010). No
      conjunto v3, a janela é de dois anos; o v2 pedia três.
  Q26:
    modelos: [fct_carteira, fct_selic, dim_tempo]
    limite: >
      31 meses e 15 decisões do Copom são pouca série para estimar defasagem
      com confiança; a resposta precisa dizer isso. O ativo problemático muda
      de critério em jan/2025, dentro da janela.
  Q27: {modelos: [fct_carteira, dim_tempo], depende_de: ["#27"]}

  # ---------------------------------------------------------------------------
  # PT: Automação do trabalho repetitivo
  # EN: Automating repetitive work
  # ---------------------------------------------------------------------------
  Q28: {modelos: [fct_carteira, dim_modalidade, dim_tempo]}
  Q29: {modelos: [fct_carteira, dim_modalidade, dim_tempo]}
  Q30:
    modelos: [fct_carteira, fct_carteira_v1, dim_modalidade, dim_tempo]
    limite: "A série reconstruída não reproduz os totais da V1, e a diferença não é uniforme por modalidade."

  # ---------------------------------------------------------------------------
  # PT: Armadilhas de classificação
  # EN: Classification traps
  # ---------------------------------------------------------------------------
  Q31: {modelos: [fct_carteira, dim_modalidade]}
  Q32: {modelos: [fct_carteira, dim_modalidade]}
  Q33:
    modelos: [fct_carteira, dim_porte]
    limite: "Agrupar por dim_porte.porte, e não por porte_desambiguado, mistura duas taxonomias."
  Q34: {modelos: [fct_carteira, dim_modalidade]}
  Q35: {modelos: [fct_carteira, dim_modalidade]}

  # ---------------------------------------------------------------------------
  # PT: Limites do dado e comparabilidade
  # EN: Data limits and comparability
  # ---------------------------------------------------------------------------
  Q36: {modelos: [fct_carteira]}
  Q37:
    modelos: [fct_carteira, dim_tempo]
    limite: "A soma de numero_de_operacoes é limite inferior quando há contagem suprimida no grupo."
  Q38: {modelos: [fct_carteira, fct_carteira_v1, dim_tempo]}
  Q39: {modelos: [fct_carteira, fct_carteira_v1, dim_tempo]}
  Q40: {modelos: [fct_carteira]}
  Q41:
    modelos: [fct_carteira]
    limite: >
      Abstenção. O fato não tem taxa, receita nem custo de captação, e é ele
      que prova a ausência.

telas:

  tela_1:
    titulo: "Onde está o crédito PJ hoje, e onde ele é escasso por empresa ativa"
    modelos: [mrt_carteira_mensal, mrt_carteira_por_uf]
  tela_2:
    titulo: "Onde o risco está piorando, com a distinção entre inadimplência e ativo problemático"
    modelos: [mrt_carteira_mensal]
  tela_3:
    titulo: "Para onde a carteira aponta nos próximos três meses, com intervalo"
    depende_de: ["#27"]
    limite: "Movida para a v0.2 em 2026-09-24. O histórico já está em mrt_carteira_mensal."
  tela_4:
    titulo: "A recomendação, com o custo de errar e o que o dado não permite afirmar"
    modelos: [mrt_decisao, mrt_limites_do_dado, mrt_reconciliacao_versoes, mrt_erro_da_reconstrucao]
